name: CI Tag

run-name: Release ${{ github.ref_name }}

# Pushing a version tag, vX.Y.Z, checks the tagged commit and releases it on
# GitHub, as release.yml does. Tags are pushed by hand, on a commit of main:
#
#   git tag v0.1.0 origin/main && git push origin v0.1.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  check:
    name: Check
    uses: ./.github/workflows/run-checks.yml
    secrets: inherit

  release:
    name: Release
    needs: check
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
    secrets: inherit
