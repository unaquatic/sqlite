name: Release

run-name: Release ${{ inputs.tag }}

# Release creates the GitHub release of a version tag, vX.Y.Z, pushed by hand
# on a commit of main. Its notes, as release-notes.sh writes them, list every
# squash-merged pull request since the previous version with its title and
# summary. A tag released before is left as it is.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, vX.Y.Z"
        type: string
        required: true

  workflow_call:
    inputs:
      tag:
        description: "Version tag to release, vX.Y.Z"
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is no version vX.Y.Z" >&2
            exit 1
          fi
          sha=$(git rev-parse "$TAG^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "$TAG tags $sha, which is not on main" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG is released already"
            exit 0
          fi
          echo "releasing $sha as $TAG"

          .github/scripts/release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "$TAG" --notes-file notes.md
